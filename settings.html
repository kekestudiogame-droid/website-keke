
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kerjiva — Pengaturan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #14213d;
    }

    .page {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .settings-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 15px 40px rgba(20, 33, 61, 0.10);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .icon {
      font-size: 46px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #64748b;
      line-height: 1.6;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .setting-item:last-of-type {
      border-bottom: 0;
    }

    .setting-info h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .setting-info p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .setting-button {
      flex-shrink: 0;
      padding: 9px 16px;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      background: #ffffff;
      color: #123b6d;
      font-weight: 600;
      cursor: pointer;
    }

    .setting-button:hover {
      background: #f1f5f9;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 11px 22px;
      border-radius: 10px;
      background: #123b6d;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .back-button:hover {
      opacity: .9;
    }
.notification-panel {
  margin-top: 28px;
  padding: 22px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
}

.notification-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
  padding-bottom: 16px;
  border-bottom: 1px solid #e2e8f0;
}

.notification-header h2 {
  margin: 0 0 6px;
  font-size: 20px;
}

.notification-header p {
  margin: 0;
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
}

.notification-close {
  border: 0;
  background: #ffffff;
  color: #64748b;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

.notification-close:hover {
  background: #e2e8f0;
}

.notification-list {
  padding-top: 18px;
}

.notification-empty {
  text-align: center;
  padding: 30px 15px;
}

.notification-empty-icon {
  font-size: 38px;
  margin-bottom: 10px;
}

.notification-empty h3 {
  margin: 0 0 8px;
  font-size: 17px;
}

.notification-empty p {
  margin: 0;
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
}
    .notification-item {
  display: flex;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid #e5e7eb;
}

.notification-item:last-child {
  border-bottom: 0;
}

.notification-item-icon {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef4ff;
  border-radius: 12px;
  font-size: 20px;
}

.notification-item-content {
  flex: 1;
}

.notification-item-content h3 {
  margin: 0 0 5px;
  font-size: 15px;
}

.notification-item-content p {
  margin: 0 0 7px;
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
}

.notification-item-content small {
  color: #94a3b8;
  font-size: 12px;
}

.notification-status {
  display: inline-block;
  margin-right: 8px;
  padding: 3px 8px;
  border-radius: 6px;
  background: #eef2f7;
  color: #475569;
  font-size: 11px;
  font-weight: 600;
}
    @media (max-width: 560px) {
      .page {
        padding: 24px 14px;
      }

      .settings-card {
        padding: 24px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .setting-item {
        align-items: flex-start;
      }

      .setting-button {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="container">

      <section class="settings-card">

        <header class="header">
          <div class="icon">⚙️</div>

          <h1>Pengaturan</h1>

          <p>
            Kelola pengaturan akun dan preferensi Kerjiva.
          </p>
        </header>

        <div class="setting-item">
          <div class="setting-info">
            <h2>🔔 Notifikasi</h2>
            <p>
              Atur preferensi notifikasi akun dan informasi Kerjiva.
            </p>
          </div>

         <button class="setting-button" id="notificationSettingsBtn" type="button">
            Atur
         </button>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <h2>🔒 Keamanan Akun</h2>
            <p>
              Kelola keamanan akun dan pengaturan akses.
            </p>
          </div>

          <button class="setting-button" type="button">
            Kelola
          </button>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <h2>👤 Profil & Akun</h2>
            <p>
              Kelola informasi profil dan akun Kerjiva.
            </p>
          </div>

        <button
            class="setting-button"
            id="profileAccountBtn"
             type="button">
             Buka
         </button>
        </div>

        <a href="index.html" class="back-button">
          ← Kembali ke Kerjiva
        </a>

      </section>

    </div>
  </main>

  <script src="language.js"></script>
<script>
const SUPABASE_URL =
  "https://ksqrimmecpriyepsuclc.supabase.co/rest/v1/";

const SUPABASE_KEY =
  "sb_publishable_xvPQL9oniSRwZoqmSc5W4A_NS9ldWIL";

const supabaseHeaders = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json"
};

const notificationSettingsBtn =
  document.getElementById("notificationSettingsBtn");

if (notificationSettingsBtn) {

  notificationSettingsBtn.onclick = async function () {

    const existingPanel =
      document.getElementById("notificationPanel");

    if (existingPanel) {
      existingPanel.remove();
      return;
    }

    const panel = document.createElement("section");

    panel.id = "notificationPanel";
    panel.className = "notification-panel";

    panel.innerHTML = `
      <div class="notification-header">
        <div>
          <h2>🔔 Notifikasi</h2>
          <p>Informasi terbaru mengenai aktivitas akun Anda.</p>
        </div>

        <button
          type="button"
          class="notification-close"
          id="closeNotificationPanel">
          ✕
        </button>
      </div>

      <div id="notificationList" class="notification-list">
        <div class="notification-empty">
          <div class="notification-empty-icon">🔄</div>
          <h3>Memuat Notifikasi</h3>
          <p>
            Mengambil data terbaru dari Kerjiva...
          </p>
        </div>
      </div>
    `;

  document
  .querySelector(".setting-item:first-of-type")
  .after(panel);
    
    panel.scrollIntoView({
  behavior: "smooth",
  block: "nearest"
});

    document
      .getElementById("closeNotificationPanel")
      .onclick = function () {
        panel.remove();
      };

await loadNotifications();

const currentLanguage =
  localStorage.getItem("siteLanguage") || "id";

if (
  currentLanguage === "en" &&
  typeof window.translateText === "function"
) {

   panel.querySelectorAll("*").forEach(function (element) {

    if (
      element.children.length === 0 &&
      element.textContent.trim()
    ) {

      element.textContent =
        window.translateText(
          element.textContent,
          "en"
        );

    }

  });

  }
};
}

// =====================================================
// AMBIL NOTIFIKASI DARI SUPABASE
// =====================================================

async function loadNotifications() {

  const list =
    document.getElementById("notificationList");

  if (!list) return;

     const userData =
       localStorage.getItem("kerjivaUser");
  
const accessToken =
  localStorage.getItem("kerjivaAccessToken");
  
  if (!userData || !accessToken) {

    list.innerHTML = `
      <div class="notification-empty">
        <div class="notification-empty-icon">🔒</div>

        <h3>Silakan Masuk</h3>

        <p>
          Masuk ke akun Kerjiva untuk melihat notifikasi.
        </p>
      </div>
    `;

    return;
  }

  let currentUser;

  try {
    currentUser = JSON.parse(userData);
  } catch (error) {
    console.error(
      "Data pengguna tidak valid:",
      error
    );
    return;
  }

  const userId = currentUser.id;

  try {

    const response = await fetch(
      `${SUPABASE_URL}applications?select=*&user_id=eq.${encodeURIComponent(userId)}&order=created_at.desc`,
      {
        headers: supabaseHeaders
      }
    );

    if (!response.ok) {
      throw new Error(
        `Gagal mengambil applications: ${response.status}`
      );
    }

    const applications =
      await response.json();

    // ---------------------------------------------------
    // BELUM ADA LAMARAN
    // ---------------------------------------------------

    if (!Array.isArray(applications) ||
        applications.length === 0) {

      list.innerHTML = `
        <div class="notification-empty">

          <div class="notification-empty-icon">
            🔔
          </div>

          <h3>Belum Ada Notifikasi</h3>

          <p>
            Belum ada aktivitas baru pada akun Anda.
          </p>

        </div>
      `;

      return;
    }

 // ---------------------------------------------------
// TAMPILKAN DATA LAMARAN
// ---------------------------------------------------

list.innerHTML = applications
  .slice(0, 20)
  .map(application => {

    const dateText =
      application.created_at
        ? new Date(
            application.created_at
          ).toLocaleString("id-ID")
        : "";

    return `
      <div class="notification-item">

        <div class="notification-item-icon">
          📄
        </div>

        <div class="notification-item-content">

          <h3>
            Lamaran Terkirim
          </h3>

          <p>
            Lamaran Anda telah tercatat di sistem Kerjiva.
          </p>

          ${
            application.status
              ? `
                <span class="notification-status">
                  ${application.status}
                </span>
              `
              : ""
          }

          <small>
            ${dateText}
          </small>

        </div>

      </div>
    `;
  })
  .join("");

  } catch (error) {

    console.error(
      "Gagal mengambil notifikasi:",
      error
    );

    list.innerHTML = `
      <div class="notification-empty">

        <div class="notification-empty-icon">
          ⚠️
        </div>

        <h3>
          Notifikasi Tidak Dapat Dimuat
        </h3>

        <p>
          Silakan coba lagi nanti.
        </p>

      </div>
    `;
  }
}


// =====================================================
// KEAMANAN AKUN
// =====================================================

const securityButtons =
  document.querySelectorAll(".setting-button");

if (securityButtons[1]) {

  securityButtons[1].onclick = function () {

    const existingPanel =
      document.getElementById("securityPanel");

    if (existingPanel) {
      existingPanel.remove();
      return;
    }

    const panel =
      document.createElement("section");

    panel.id = "securityPanel";
    panel.className = "notification-panel";

    panel.innerHTML = `
      <div class="notification-header">

        <div>
          <h2>🔒 Keamanan Akun</h2>

        <p>
            Kelola keamanan akun dan pengaturan akses.
        </p>
        </div>

        <button
          type="button"
          class="notification-close"
          id="closeSecurityPanel">
          ✕
        </button>

      </div>

      <div class="notification-list">

        <div class="notification-item">

          <div class="notification-item-icon">
            🔑
          </div>

          <div class="notification-item-content">

            <h3>Ubah Password</h3>

            <p>
             <p>Gunakan password yang kuat dan jangan membagikannya kepada orang lain.</p>
            </p>

            <button
              type="button"
              class="setting-button"
              id="changePasswordBtn">
              Ubah Password
            </button>

          </div>

        </div>

        <div class="notification-item">

          <div class="notification-item-icon">
            🛡️
          </div>

          <div class="notification-item-content">

            <h3>Status Keamanan</h3>

            <p>
             <p>Akun Anda menggunakan autentikasi Kerjiva dan perlindungan akses berbasis akun.</p>
            </p>

          </div>

        </div>

      </div>
    `;

    document
      .querySelector(".settings-card")
      .appendChild(panel);

    document
      .getElementById("closeSecurityPanel")
      .onclick = function () {
        panel.remove();
      };

    document
      .getElementById("changePasswordBtn")
      .onclick = function () {
        
      const currentLanguage =
  localStorage.getItem("siteLanguage") || "id";

const message =
  currentLanguage === "en"
    ? "The password change feature will be enabled in the next step."
    : "Fitur ubah password akan kita aktifkan pada langkah berikutnya.";

alert(message);
      };
const currentLanguage =
  localStorage.getItem("siteLanguage") || "id";

if (
  currentLanguage === "en" &&
  typeof window.translateText === "function"
) {

  panel.querySelectorAll("*").forEach(function (element) {

    if (
      element.children.length === 0 &&
      element.textContent.trim()
    ) {

      element.textContent =
        window.translateText(
          element.textContent,
          "en"
        );

    }

  });

}
  };
}
  // =====================================================
// PROFIL & AKUN
// =====================================================

const profileAccountBtn =
  document.getElementById("profileAccountBtn");

if (profileAccountBtn) {

  profileAccountBtn.onclick = async function () {

    const existingPanel =
      document.getElementById("profileAccountPanel");

    if (existingPanel) {
      existingPanel.remove();
      return;
    }

    const panel =
      document.createElement("section");

    panel.id = "profileAccountPanel";
    panel.className = "notification-panel";

    panel.innerHTML = `
      <div class="notification-header">

        <div>
          <h2>👤 Profil & Akun</h2>

          <p>
            Kelola informasi profil dan akun Kerjiva.
          </p>
        </div>

        <button
          type="button"
          class="notification-close"
          id="closeProfileAccountPanel">
          ✕
        </button>

      </div>

      <div id="profileAccountList" class="notification-list">

        <div class="notification-empty">

          <div class="notification-empty-icon">
            🔄
          </div>

          <h3>Memuat Profil</h3>

          <p>
            Mengambil data profil Anda...
          </p>

        </div>

      </div>
    `;

    document
      .querySelector(".settings-card")
      .appendChild(panel);

    document
      .getElementById("closeProfileAccountPanel")
      .onclick = function () {
        panel.remove();
      };

    const list =
      document.getElementById("profileAccountList");

    const userData =
      localStorage.getItem("cariKerjakuUser");

    const accessToken =
      localStorage.getItem("cariKerjakuAccessToken");

    if (!userData || !accessToken) {

      list.innerHTML = `
        <div class="notification-empty">

          <div class="notification-empty-icon">
            🔒
          </div>

          <h3>Silakan Masuk</h3>

          <p>
            Masuk ke akun Kerjiva untuk melihat profil Anda.
          </p>

        </div>
      `;

      return;
    }

    let currentUser;

    try {

      currentUser =
        JSON.parse(userData);

    } catch (error) {

      console.error(
        "Data pengguna tidak valid:",
        error
      );

      list.innerHTML = `
        <div class="notification-empty">

          <div class="notification-empty-icon">
            ⚠️
          </div>

          <h3>Profil Tidak Dapat Dimuat</h3>

          <p>
            Data akun tidak valid.
          </p>

        </div>
      `;

      return;
    }

    const userId =
      currentUser.id;

    try {

      const response =
        await fetch(
          `${SUPABASE_URL}jobseeker_profiles?id=eq.${encodeURIComponent(userId)}&select=id,full_name,phone,city,education,experience`,
          {
            headers: {
              ...supabaseHeaders,
              Authorization:
                `Bearer ${accessToken}`
            }
          }
        );

      if (!response.ok) {

        throw new Error(
          `Gagal mengambil profil: ${response.status}`
        );

      }

      const profiles =
        await response.json();

      if (
        !Array.isArray(profiles) ||
        profiles.length === 0
      ) {

        list.innerHTML = `
          <div class="notification-empty">

            <div class="notification-empty-icon">
              👤
            </div>

            <h3>Profil Belum Tersedia</h3>

            <p>
              Data profil Anda belum ditemukan.
            </p>

          </div>
        `;

        return;
      }

      const profile =
        profiles[0];

      list.innerHTML = `

        <div class="notification-item">

          <div class="notification-item-icon">
            👤
          </div>

          <div class="notification-item-content">

            <h3>Nama Lengkap</h3>

            <p>
              ${profile.full_name || "-"}
            </p>

          </div>

        </div>

        <div class="notification-item">

          <div class="notification-item-icon">
            📱
          </div>

          <div class="notification-item-content">

            <h3>Nomor Telepon</h3>

            <p>
              ${profile.phone || "-"}
            </p>

          </div>

        </div>

        <div class="notification-item">

          <div class="notification-item-icon">
            📍
          </div>

          <div class="notification-item-content">

            <h3>Kota</h3>

            <p>
              ${profile.city || "-"}
            </p>

          </div>

        </div>

        <div class="notification-item">

          <div class="notification-item-icon">
            🎓
          </div>

          <div class="notification-item-content">

            <h3>Pendidikan</h3>

            <p>
              ${profile.education || "-"}
            </p>

          </div>

        </div>

        <div class="notification-item">

          <div class="notification-item-icon">
            💼
          </div>

          <div class="notification-item-content">

            <h3>Pengalaman</h3>

            <p>
              ${profile.experience || "-"}
            </p>

          </div>

        </div>

      `;

      const currentLanguage =
        localStorage.getItem("siteLanguage") || "id";

      if (
        currentLanguage === "en" &&
        typeof window.translateText === "function"
      ) {

        panel
          .querySelectorAll("*")
          .forEach(function (element) {

            if (
              element.children.length === 0 &&
              element.textContent.trim()
            ) {

              element.textContent =
                window.translateText(
                  element.textContent,
                  "en"
                );

            }

          });

      }

    } catch (error) {

      console.error(
        "Gagal mengambil profil:",
        error
      );

      list.innerHTML = `
        <div class="notification-empty">

          <div class="notification-empty-icon">
            ⚠️
          </div>

          <h3>Profil Tidak Dapat Dimuat</h3>

          <p>
            Silakan coba lagi nanti.
          </p>

        </div>
      `;

    }

  };

}

</script>
</body>
</html>
